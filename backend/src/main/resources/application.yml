server:
  port: 8080
  servlet:
    session:
      cookie:
        same-site: lax
        # secure: true   # enable once served over HTTPS
okno:
  auth:
    # Demo accounts. Override via env; don't reuse these anywhere real.
    users:
      planner: ${OKNO_PLANNER_PASSWORD:planner-demo}
      technologist: ${OKNO_TECH_PASSWORD:tech-demo}
management:
  endpoints:
    web:
      exposure:
        include: health
spring:
  # Keep F1's existing in-memory demo/test flow. Opt in with profile "database".
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  application:
    name: okno-vsm-api
