services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: okno
      POSTGRES_USER: okno
      POSTGRES_PASSWORD: okno
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://api:8080
    depends_on:
      - api

volumes:
  pgdata:
