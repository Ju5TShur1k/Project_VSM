services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: okno
      POSTGRES_USER: okno
      POSTGRES_PASSWORD: okno
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okno -d okno"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: database
      DB_URL: jdbc:postgresql://postgres:5432/okno
      DB_USER: okno
      DB_PASSWORD: okno
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://api:8080
    depends_on:
      - api

volumes:
  pgdata:
