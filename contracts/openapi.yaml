openapi: 3.1.0
info:
  title: OKNO VSM API
  version: "0.2.0"
servers:
  - url: /api/v1
# Everything except /actuator/health requires a session (cookie JSESSIONID from
# /auth/login). State-changing requests must also send the X-XSRF-TOKEN header
# with the value of the XSRF-TOKEN cookie (set on the first response, even a 401).
# Unauthenticated calls get 401 with the standard ApiError body.
paths:
  /auth/login:
    post:
      summary: Log in (form-encoded username + password), starts a session
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200': { description: Logged in }
        '401':
          description: Bad credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /auth/logout:
    post:
      summary: End the session
      responses:
        '200': { description: Logged out }

  /auth/me:
    get:
      summary: Current user (also used to obtain the XSRF-TOKEN cookie)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: { type: string }
                  role: { type: string, enum: [PLANNER, TECHNOLOGIST, DISPATCHER] }
        '401':
          description: Not logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /scenarios/import:
    post:
      summary: Import scenario
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                trains:
                  type: array
                  items:
                    $ref: '#/components/schemas/Train'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenarioId: { type: string, format: uuid }
                  warnings: { type: array, items: { type: string } }
                  provenance: { type: string }
        '422':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /demo/source:
    post:
      summary: Create synthetic E2 source facts and capture an immutable D1 snapshot
      description: Requires the database profile. All facts are labelled demonstration data.
      responses:
        '201':
          description: Saved source snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoSource' }

  /demo/scenarios/{id}/r1-arrival:
    post:
      summary: Change R1 arrival by creating a new scenario version and immutable snapshot
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arrivalMinute]
              properties:
                arrivalMinute: { type: integer, minimum: 50, maximum: 60, description: "Minutes after 2028-07-01T00:00:00+03:00" }
      responses:
        '200':
          description: New saved source snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoSource' }

  /demo/case-source:
    post:
      summary: Load additive case-derived model datasets and capture the saved source
      description: Numeric norms come from case 06; histories, dates and trips are modelled. FULL43 has an E3 assessment, but no approved 14-day plan yet.
      parameters:
        - in: query
          name: dataset
          required: true
          schema: { type: string, enum: [FULL43, E2_6, BLOCKED6] }
      responses:
        '201':
          description: Saved case model dataset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseDataset' }
        '422':
          description: Invalid dataset or missing database profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /source-snapshots/{id}/e3-assessment:
    get:
      summary: Assess whether the saved full-fleet source has a necessary service window for each work
      description: Read-only preflight. A result without blockers does not prove feasibility or D2 approval.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Full-fleet fixed-assignment assessment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/E3Assessment' }
        '404':
          description: Snapshot not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: Snapshot does not contain supported E3 source facts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /source-snapshots/{id}/e3-candidate-assessment:
    post:
      summary: Preview a full-fleet trip reassignment against one immutable source snapshot
      description: Read-only assessment of trip identity, mileage obligations, reserve by city and cleaning gaps. It does not run the solver, create a plan or grant D2 PASS.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/E3CandidateInput' }
      responses:
        '200':
          description: Candidate assessment, including blockers and unfinished operational obligations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/E3CandidateAssessment' }
        '404':
          description: Snapshot not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: Candidate or source violates a supported E3 rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /source-snapshots/{id}/e3-rotation-search:
    post:
      summary: Search a bounded, source-backed return rotation that frees a maintenance window
      description: Read-only necessary-condition search. A proposed rotation has independently checked trip and mileage facts, but no CP-SAT plan, cleaning placement or full D2 approval.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/E3RotationSearchInput' }
      responses:
        '200':
          description: One improving rotation or an explicit reason that the bounded search found none
          content:
            application/json:
              schema: { $ref: '#/components/schemas/E3RotationCandidate' }
        '404':
          description: Snapshot not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: Invalid search parameters or unsupported source facts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /source-snapshots/{id}/e3-maintenance-candidate-solve:
    post:
      summary: Run maintenance CP-SAT for a verified full-fleet trip candidate
      description: Returns maintenance placement only. Missing cleaning, release rules and independent full D2 keep fullSolverStatus=NOT_RUN and d2Status=NOT_PERFORMED. No plan is saved or approvable.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/E3MaintenanceCandidateInput' }
      responses:
        '200':
          description: Maintenance-only solve and remaining operational obligations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/E3MaintenanceCandidateResult' }
        '404':
          description: Snapshot not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: Invalid candidate or unsupported source facts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /source-snapshots/{id}/e3-joint-candidate:
    post:
      summary: Search several verified return rotations and run maintenance CP-SAT
      description: Bounded exploratory decomposition. It reports a maintenance candidate only; cleaning and release integration, durable plan and independent full D2 remain pending.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/E3JointCandidateInput' }
      responses:
        '200':
          description: Bounded candidate result with explicit maintenance, full solver and D2 status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/E3JointCandidateResult' }
        '404':
          description: Snapshot not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: Invalid search parameters or unsupported source facts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /scenarios/{id}:
    get:
      summary: Get scenario snapshot
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  createdAt: { type: string, format: date-time }
                  provenance: { type: string }
                  trainCount: { type: integer }

  /scenarios/{id}/trains:
    get:
      summary: Get fleet for scenario
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Train' }

  /scenarios/{id}/events:
    post:
      summary: Inject event, creates new scenario version
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [MACHINE_DOWN, UNPLANNED_INSPECTION] }
                description: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  newScenarioId: { type: string, format: uuid }
        '422':
          description: Unknown failure kind
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /planning-jobs:
    post:
      summary: Start a planning job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobRequest' }
      description: >
        Queues the job and returns immediately (status QUEUED); the solver runs on
        a worker thread. Poll GET /planning-jobs/{id} until status is terminal.
        A repeated idempotencyKey with the SAME request body returns the existing
        job; the same key with a DIFFERENT body is 409 IDEMPOTENCY_KEY_REUSED.
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobStatus' }
        '409':
          description: idempotencyKey reused with a different request body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: Invalid policy / timeLimitSec (1..300) / seed / frozenUntil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /planning-jobs/{id}:
    get:
      summary: Get job status
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobStatus' }

  /plans/{id}:
    get:
      summary: Get plan detail
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }

  /plans/{id}/calendar:
    get:
      summary: Calendar from the immutable snapshot and actual planner result
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Fixed source trips and calculated service intervals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanCalendar' }

  /plans/{id}/approve:
    post:
      summary: Approve a plan version
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedVersion: { type: integer }
                actorId: { type: string }
                comment: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '409':
          description: Version conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: >
            PLAN_NOT_APPROVABLE - the plan carries a CRITICAL validation, the solver
            found no admissible plan, or independent validation has not passed.
            Approval requires a D2 PASS report bound to the current source snapshot,
            plan version, solver status and event fingerprint. NOT_PERFORMED blocks approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /current-plan:
    get:
      summary: Effective approved plan; a new draft never replaces it. Any role.
      parameters:
        - in: query
          name: scenarioId
          schema: { type: string, format: uuid }
          description: Optional immutable scenario version; selection is shared by its root.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  planId: { type: string, format: uuid, nullable: true }

  /incidents:
    get:
      summary: Dispatcher's incident log, newest first. Any role.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Incident' } }
    post:
      summary: Report a trip change, urgent maintenance or equipment failure. Logged for the planner; not fed to the solver.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [train, kind, description]
              properties:
                train: { type: string }
                kind: { type: string, enum: [TRIP_CHANGE, URGENT_MAINTENANCE, EQUIPMENT_DOWN] }
                description: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '422':
          description: Invalid train, kind or description
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /plans/{id}/export:
    get:
      summary: Export plan as CSV
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema: { type: string }

  /scenarios/{id}/operations:
    post:
      summary: Start a persisted FULL43 advisory operational day
      description: Database profile only. Captures an immutable modelled source; does not authorize full E3 maintenance or actual release.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '201':
          description: Initial operational board
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryBoard' }
        '404': { description: Unknown scenario }
        '422': { description: Unsupported source or rules }
  /operations/{id}:
    get:
      summary: Restore current operational board from PostgreSQL
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { $ref: '#/components/responses/RecoveryUpdated' }
        '404': { description: Unknown session }
  /operations/{id}/failures:
    post:
      summary: Withdraw a train before its next departure in this modelled day
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FailureRequest' }
      responses:
        '200': { $ref: '#/components/responses/RecoveryUpdated' }
        '409': { description: Stale expectedVersion }
        '422': { description: Invalid failure, time, or missing expectedVersion }
  /operations/{id}/replacements:
    post:
      summary: Recheck and assign an eligible reserve to the remaining daily turn
      description: Operator decision; preserves times, route and paired slot. Reserve shortage is visible and does not silently forbid dispatch. No cross-city teleportation.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplacementRequest' }
      responses:
        '200': { $ref: '#/components/responses/RecoveryUpdated' }
        '409': { description: Stale expectedVersion }
        '422': { description: Ineligible candidate or invalid request }
  /operations/{id}/releases:
    post:
      summary: Record explicit modelled repair completion and acceptance into reserve
      description: Repair forecast is not acceptance. Original withdrawn trips are never automatically reassigned.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseRequest' }
      responses:
        '200': { $ref: '#/components/responses/RecoveryUpdated' }
        '409': { description: Stale expectedVersion }
        '422': { description: Invalid acceptance, location or time }
  /operations/{id}/clock:
    post:
      summary: Advance modelled time without inventing repair acceptance
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClockRequest' }
      responses:
        '200': { $ref: '#/components/responses/RecoveryUpdated' }
        '409': { description: Stale expectedVersion }
        '422': { description: Time reversal, out of horizon or invalid request }

  /scenarios/{id}/version:
    get:
      summary: Get current source head for this version root
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceVersion' }

  /scenarios/{id}/versions:
    get:
      summary: List immutable versions including the initial source
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SourceVersion' } }

  /scenarios/{id}/source:
    get:
      summary: Open this exact immutable D1 source snapshot
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /scenarios/{id}/plan-selection:
    get:
      summary: Get separate latest draft and effective approved plan
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanSelection' }

  /change-requests/{id}:
    get:
      summary: Get request linked to a concrete source version and calculation
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeReceipt' }

  /change-requests/{id}/history:
    get:
      summary: Get append-only request lifecycle, authors and times
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RequestUpdate' } }

  /change-requests/updates:
    get:
      summary: Replay notifications after a durable cursor
      parameters:
        - in: query
          name: after
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestUpdates' }

  /change-requests/stream:
    get:
      summary: Request status SSE stream; any registered role
      description: Events are named request-status. Their ID is a durable request_event sequence. Reconnect with Last-Event-ID; keep-alive comments are sent every 15 seconds.
      parameters:
        - in: query
          name: after
          schema: { type: integer, minimum: 0, default: 0 }
        - in: header
          name: Last-Event-ID
          schema: { type: string, pattern: '^[0-9]+$' }
      responses:
        '200':
          description: SSE stream, reconnect after the five-minute connection timeout
          content:
            text/event-stream:
              schema: { type: string }

  /change-requests:
    get:
      summary: List newest requests and their latest processing status
      parameters:
        - in: query
          name: scenarioId
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ChangeReceipt' } }
    post:
      summary: Persist request, changed source version and canonical snapshot atomically
      description: Dispatcher, planner or technologist; CSRF required. Exact actor/key retry returns the same request. A stale head/version or key reused with different content is 409. No service slot is assigned here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeCommand' }
      responses:
        '201':
          description: Saved, including an exact retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeReceipt' }

        '409':
          description: VERSION_CONFLICT or IDEMPOTENCY_KEY_REUSED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

        '422':
          description: Invalid identifier, time, overlap or request shape
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

        '403': { description: Role or CSRF check failed }

  /scenarios/{id}/source-fact-versions:
    post:
      summary: Version explicit train releases or the urgent work catalog
      description: TECHNOLOGIST only. change.kind is TRAIN_RELEASE or URGENT_RULE_CHANGE. Uses the exact source version in the path and existing expectedVersion/idempotencyKey rules. No automatic calculation or approval; older adapters reject the new facts explicitly.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeCommand' }
      responses:
        '201':
          description: Saved new source version or exact replay, including request and snapshot/hash
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeReceipt' }
        '403': { description: Role or CSRF check failed }
        '409': { description: VERSION_CONFLICT or IDEMPOTENCY_KEY_REUSED }
        '422': { description: Invalid facts, resources, acceptance evidence or request shape }
  /scenarios/{id}/urgent-work-rules:
    get:
      summary: Read the urgent work catalog from the exact immutable source version
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Catalog for this version, empty when no norms are supplied
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/UrgentWorkSourceRule' } }
        '404': { description: Source version not found }
  /scenarios/{id}/rule-versions:
    post:
      summary: Persist request, changed source version and canonical snapshot atomically
      description: TECHNOLOGIST only; change.kind must be RULE_CHANGE and scenarioId must match the path. Old rules/credits remain historical. A changed mileage grid requires explicit baselines for every train/cycle.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeCommand' }
      responses:
        '201':
          description: Saved, including an exact retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeReceipt' }

        '409':
          description: VERSION_CONFLICT or IDEMPOTENCY_KEY_REUSED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

        '422':
          description: Invalid identifier, time, overlap or request shape
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

        '403': { description: Role or CSRF check failed }

  /scenarios/{id}/requests:
    post:
      summary: UI_CONTRACT request; dispatcher or planner
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      description: Atomically saves source version, canonical snapshot, request and queued job. Same actor/clientRequestId/body returns 200; stale hash or changed retry is 409. CSRF required.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UiNewRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UiChangeRequest' }

        '200':
          description: Exact retry, same request and job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UiChangeRequest' }

        '409':
          description: Stale hash or reused clientRequestId
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

        '422':
          description: Invalid source facts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

        '403': { description: Role or CSRF check failed }
  /requests:
    get:
      summary: UI_CONTRACT trip and urgent maintenance requests; all registered roles
      parameters:
        - in: query
          name: scenarioId
          schema: { type: string, format: uuid }
          description: Any source revision of a root; returns all requests for that root
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/UiChangeRequest' } }

  /requests/{id}:
    get:
      summary: UI_CONTRACT request detail
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UiChangeRequest' }

  /plans/active:
    get:
      summary: Effective human-approved Plan; all registered roles
      parameters:
        - in: query
          name: scenarioId
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }

        '204': { description: No approved plan }

components:
  responses:
    RecoveryUpdated:
      description: Current persisted advisory board; version and canonical stateHash identify this revision
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RecoveryBoard' }
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    FailureRequest:
      type: object
      required: [expectedVersion, tripId, occurredAt, description]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        tripId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        expectedRepairAt: { type: [string, 'null'], format: date-time }
        description: { type: string, minLength: 1, maxLength: 1000 }
    ReplacementRequest:
      type: object
      required: [expectedVersion, faultId, trainId]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        faultId: { type: string, format: uuid }
        trainId: { type: string, format: uuid }
    ReleaseRequest:
      type: object
      required: [expectedVersion, faultId, repairCompletedAt, acceptedAt, location, acceptanceReference]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        faultId: { type: string, format: uuid }
        repairCompletedAt: { type: string, format: date-time }
        acceptedAt: { type: string, format: date-time }
        location: { type: string }
        acceptanceReference: { type: string, minLength: 1, maxLength: 200 }
    ClockRequest:
      type: object
      required: [expectedVersion, asOf]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        asOf: { type: string, format: date-time }
    RecoveryCandidate:
      type: object
      required: [trainId, externalId, location, eligible, reasons]
      properties:
        trainId: { type: string, format: uuid }
        externalId: { type: string }
        location: { type: string }
        eligible: { type: boolean }
        reasons: { type: array, items: { type: string } }
    RecoveryTrain:
      type: object
      required: [id, externalId, status, location, mileageKm, readinessEvidence]
      properties:
        id: { type: string, format: uuid }
        externalId: { type: string }
        status: { type: string, enum: [LINE, RESERVE, MAINTENANCE, FAILED, IN_SERVICE, UNKNOWN] }
        location: { type: string }
        mileageKm: { type: integer, format: int64 }
        tripsSinceCleaning: { type: [integer, 'null'] }
        readinessEvidence: { type: string }
    RecoveryTrip:
      type: object
      required: [id, label, pairKey, plannedTrainId, plannedTrain, effectiveTrainId, effectiveTrain, origin, destination, departureAt, arrivalAt, coverage]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        pairKey: { type: string }
        plannedTrainId: { type: string, format: uuid }
        plannedTrain: { type: string }
        effectiveTrainId: { type: string, format: uuid }
        effectiveTrain: { type: string }
        origin: { type: string }
        destination: { type: string }
        departureAt: { type: string, format: date-time }
        arrivalAt: { type: string, format: date-time }
        coverage: { type: string, enum: [SCHEDULED, REPLACED, UNCOVERED] }
    RecoveryFault:
      type: object
      required: [id, trainId, train, trip, occurredAt, description, status, affectedTripIds, candidates]
      properties:
        id: { type: string, format: uuid }
        trainId: { type: string, format: uuid }
        train: { type: string }
        trip: { type: string }
        occurredAt: { type: string, format: date-time }
        expectedRepairAt: { type: [string, 'null'], format: date-time }
        description: { type: string }
        status: { type: string, enum: [NEEDS_REPLACEMENT, REPLACEMENT_ASSIGNED, RELEASED_TO_RESERVE] }
        affectedTripIds: { type: array, items: { type: string, format: uuid } }
        replacementTrain: { type: [string, 'null'] }
        candidates: { type: array, items: { $ref: '#/components/schemas/RecoveryCandidate' } }
        acceptedAt: { type: [string, 'null'], format: date-time }
    RecoveryBoard:
      type: object
      required: [id, version, stateHash, scenarioId, sourceSnapshotId, snapshotHash, scope, provenance, windowStart, windowEnd, asOf, policy, trainCount, availableTrainCount, unavailableTrainCount, uncoveredTripCount, incompletePairCount, reserve, trains, trips, faults, messages]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        stateHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        scenarioId: { type: string, format: uuid }
        sourceSnapshotId: { type: string, format: uuid }
        snapshotHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        scope: { type: string, const: OPERATIONAL_DAY_MODEL }
        provenance: { type: string }
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }
        asOf: { type: string, format: date-time }
        policy:
          type: object
          required: [version, preparationMinutes, targetReservePerCity, cleaningEveryTrips, source]
          properties:
            version: { type: string }
            preparationMinutes: { type: integer }
            targetReservePerCity: { type: integer }
            cleaningEveryTrips: { type: integer }
            source: { type: string }
        trainCount: { type: integer }
        availableTrainCount: { type: integer, description: Instant modelled availability, not fleet readiness KPI }
        unavailableTrainCount: { type: integer }
        uncoveredTripCount: { type: integer }
        incompletePairCount: { type: integer }
        reserve:
          type: array
          items:
            type: object
            required: [location, available, target, deficit]
            properties:
              location: { type: string }
              available: { type: integer }
              target: { type: integer }
              deficit: { type: integer }
        trains: { type: array, items: { $ref: '#/components/schemas/RecoveryTrain' } }
        trips: { type: array, items: { $ref: '#/components/schemas/RecoveryTrip' } }
        faults: { type: array, items: { $ref: '#/components/schemas/RecoveryFault' } }
        messages: { type: array, items: { type: string } }
    Incident:
      type: object
      properties:
        id: { type: string, format: uuid }
        train: { type: string }
        kind: { type: string, enum: [TRIP_CHANGE, URGENT_MAINTENANCE, EQUIPMENT_DOWN] }
        description: { type: string }
        reportedBy: { type: string }
        reportedAt: { type: string, format: date-time }
    CaseDataset:
      type: object
      required: [source, dataset, trainCount, tripCount, planningSupported, warnings]
      properties:
        source: { $ref: '#/components/schemas/DemoSource' }
        dataset: { type: string, enum: [FULL43, E2_6, BLOCKED6] }
        trainCount: { type: integer }
        tripCount: { type: integer }
        planningSupported: { type: boolean }
        warnings: { type: array, items: { type: string } }
    E3Assessment:
      type: object
      required: [scenarioId, sourceSnapshotId, snapshotHash, provenance, trainCount, tripCount, requiredWorkCount, eligibleTrainCount, peakConcurrentTrips, unassignedEligibleTrainCount, fixedAssignmentStatus, d2Status, blockers]
      properties:
        scenarioId: { type: string, format: uuid }
        sourceSnapshotId: { type: string, format: uuid }
        snapshotHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        provenance: { type: string }
        trainCount: { type: integer }
        tripCount: { type: integer }
        requiredWorkCount: { type: integer }
        eligibleTrainCount: { type: integer, description: "Trains with source status AVAILABLE or IN_SERVICE" }
        peakConcurrentTrips: { type: integer, description: "Maximum overlapping fixed trip slots" }
        unassignedEligibleTrainCount: { type: integer, description: "Eligible trains without any fixed source trip" }
        fixedAssignmentStatus:
          type: string
          enum: [BLOCKED_BY_FIXED_ASSIGNMENTS, NECESSARY_WINDOWS_PRESENT]
        d2Status: { type: string, const: NOT_PERFORMED }
        blockers:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
    E3CandidateInput:
      type: object
      required: [frozenUntil, preparationMinutes, effectiveTrainByTrip]
      properties:
        frozenUntil: { type: string, format: date-time }
        preparationMinutes: { type: integer, minimum: 0 }
        effectiveTrainByTrip:
          type: object
          description: Map of fixed trip UUID to proposed effective train UUID; omitted trips keep their source assignment.
          additionalProperties: { type: string, format: uuid }
    E3RotationSearchInput:
      type: object
      required: [frozenUntil, preparationMinutes, maxEvaluations]
      properties:
        frozenUntil: { type: string, format: date-time }
        preparationMinutes: { type: integer, minimum: 0, maximum: 1440 }
        maxEvaluations: { type: integer, minimum: 1, maximum: 32 }
        effectiveTrainByTrip:
          type: object
          description: Optional current candidate; the returned map includes previous and newly proposed assignments.
          additionalProperties: { type: string, format: uuid }
    E3RotationCandidate:
      type: object
      required: [scenarioId, sourceSnapshotId, snapshotHash, searchStatus, solverStatus, d2Status, evaluatedAssignments, initialBlockedWorks, remainingBlockedWorks, effectiveTrainByTrip, reserve, cleaning]
      properties:
        scenarioId: { type: string, format: uuid }
        sourceSnapshotId: { type: string, format: uuid }
        snapshotHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        searchStatus: { type: string, enum: [NO_FIXED_WINDOW_BLOCKER, NO_IMPROVING_ROTATION, IMPROVING_ROTATION_FOUND] }
        solverStatus: { type: string, const: NOT_RUN }
        d2Status: { type: string, const: NOT_PERFORMED }
        evaluatedAssignments: { type: integer }
        initialBlockedWorks: { type: integer }
        remainingBlockedWorks: { type: integer }
        effectiveTrainByTrip:
          type: object
          description: Cumulative trip UUID to effective train UUID map for the candidate.
          additionalProperties: { type: string, format: uuid }
        reserve: { $ref: '#/components/schemas/E3CandidateAssessment/properties/reserve' }
        cleaning: { $ref: '#/components/schemas/E3CandidateAssessment/properties/cleaning' }
    E3MaintenanceCandidateInput:
      type: object
      required: [frozenUntil, preparationMinutes, effectiveTrainByTrip, seed, timeLimitSec]
      properties:
        frozenUntil: { type: string, format: date-time }
        preparationMinutes: { type: integer, minimum: 0, maximum: 1440 }
        effectiveTrainByTrip:
          type: object
          additionalProperties: { type: string, format: uuid }
        seed: { type: integer }
        timeLimitSec: { type: integer, minimum: 1, maximum: 60 }
    E3MaintenanceCandidateResult:
      type: object
      required: [scenarioId, sourceSnapshotId, snapshotHash, tripCount, changedTripCount, maintenanceSolverStatus, fullSolverStatus, d2Status, maintenanceBlocks, diagnostics, reserve, cleaning]
      properties:
        scenarioId: { type: string, format: uuid }
        sourceSnapshotId: { type: string, format: uuid }
        snapshotHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        tripCount: { type: integer }
        changedTripCount: { type: integer }
        maintenanceSolverStatus: { type: string, enum: [NOT_RUN, OPTIMAL, FEASIBLE, INFEASIBLE, UNKNOWN, MODEL_INVALID] }
        fullSolverStatus: { type: string, const: NOT_RUN }
        d2Status: { type: string, const: NOT_PERFORMED }
        maintenanceBlocks:
          type: array
          items: { $ref: '#/components/schemas/E3MaintenanceBlock' }
        diagnostics:
          type: array
          items: { $ref: '#/components/schemas/E3Assessment/properties/blockers/items' }
        reserve: { $ref: '#/components/schemas/E3CandidateAssessment/properties/reserve' }
        cleaning: { $ref: '#/components/schemas/E3CandidateAssessment/properties/cleaning' }
    E3MaintenanceBlock:
      type: object
      required: [blockId, trainId, resourceId, startAt, endAt]
      properties:
        blockId: { type: string, format: uuid }
        trainId: { type: string, format: uuid }
        resourceId: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
    E3JointCandidateInput:
      type: object
      required: [frozenUntil, preparationMinutes, maxMoves, maxEvaluationsPerMove, seed, timeLimitSec]
      properties:
        frozenUntil: { type: string, format: date-time }
        preparationMinutes: { type: integer, minimum: 0, maximum: 1440 }
        maxMoves: { type: integer, minimum: 0, maximum: 4 }
        maxEvaluationsPerMove: { type: integer, minimum: 1, maximum: 32 }
        seed: { type: integer }
        timeLimitSec: { type: integer, minimum: 1, maximum: 60 }
    E3JointCandidateResult:
      type: object
      required: [scenarioId, sourceSnapshotId, snapshotHash, searchStatus, lastRotationStatus, moves, effectiveTrainByTrip, maintenance]
      properties:
        scenarioId: { type: string, format: uuid }
        sourceSnapshotId: { type: string, format: uuid }
        snapshotHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        searchStatus: { type: string, enum: [MAINTENANCE_CANDIDATE_FOUND, MAINTENANCE_SOLVER_INFEASIBLE, MAINTENANCE_SOLVER_UNKNOWN, MAINTENANCE_SOLVER_MODEL_INVALID, MOVE_LIMIT_REACHED, NO_FIXED_WINDOW_BLOCKER, NO_IMPROVING_ROTATION] }
        lastRotationStatus: { type: string, enum: [NOT_RUN, NO_FIXED_WINDOW_BLOCKER, NO_IMPROVING_ROTATION, IMPROVING_ROTATION_FOUND] }
        moves: { type: integer }
        effectiveTrainByTrip:
          type: object
          additionalProperties: { type: string, format: uuid }
        maintenance: { $ref: '#/components/schemas/E3MaintenanceCandidateResult' }
    E3CandidateAssessment:
      type: object
      required: [scenarioId, sourceSnapshotId, snapshotHash, tripCount, changedTripCount, mileageObligationCount, mileageStatus, solverStatus, d2Status, reserve, cleaning, blockers]
      properties:
        scenarioId: { type: string, format: uuid }
        sourceSnapshotId: { type: string, format: uuid }
        snapshotHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        tripCount: { type: integer }
        changedTripCount: { type: integer }
        mileageObligationCount: { type: integer }
        mileageStatus: { type: string, enum: [CHECKED, BLOCKED, FAILED] }
        solverStatus: { type: string, const: NOT_RUN }
        d2Status: { type: string, const: NOT_PERFORMED }
        reserve:
          type: object
          required: [snapshotHash, mobilizedTrainCount, cities]
          properties:
            snapshotHash: { type: string }
            mobilizedTrainCount: { type: integer }
            cities:
              type: array
              items:
                type: object
                required: [name, sourceTarget, remaining, deficit]
                properties:
                  name: { type: string }
                  sourceTarget: { type: integer }
                  remaining: { type: integer }
                  deficit: { type: integer }
        cleaning:
          type: object
          required: [snapshotHash, coveredCount, missing, pendingAtHorizon]
          properties:
            snapshotHash: { type: string }
            coveredCount: { type: integer }
            missing:
              type: array
              items:
                type: object
                required: [trainId, fourthTripId, nextTripId, earliestStart, latestEnd]
                properties:
                  trainId: { type: string, format: uuid }
                  fourthTripId: { type: string, format: uuid }
                  nextTripId: { type: string, format: uuid }
                  earliestStart: { type: string, format: date-time }
                  latestEnd: { type: string, format: date-time }
            pendingAtHorizon:
              type: array
              items:
                type: object
                required: [trainId, fourthTripId]
                properties:
                  trainId: { type: string, format: uuid }
                  fourthTripId: { type: string, format: uuid }
        blockers:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
    DemoSource:
      type: object
      properties:
        scenarioId: { type: string, format: uuid }
        snapshotId: { type: string, format: uuid }
        snapshotHash: { type: string }
        provenance: { type: string }
    Train:
      type: object
      properties:
        id: { type: string, format: uuid }
        externalId: { type: string }
        status:
          type: string
          enum: [AVAILABLE, IN_SERVICE, READY_IDLE, HOT_RESERVE, RESERVE, MAINTENANCE, CLEANING, FAULT, TRANSFER, AWAITING_RELEASE, NOT_COMMISSIONED]
        mileageKm: { type: number }
        nextObligation: { type: string }
    JobRequest:
      type: object
      required: [scenarioId, policy]
      properties:
        scenarioId: { type: string, format: uuid }
        policy: { type: string }
        seed: { type: integer }
        timeLimitSec: { type: integer }
        frozenUntil: { type: string, format: date-time }
        idempotencyKey: { type: string }
    JobStatus:
      type: object
      properties:
        jobId: { type: string, format: uuid }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED] }
        solverStatus: { type: string, enum: [OPTIMAL, FEASIBLE, INFEASIBLE, UNKNOWN, MODEL_INVALID] }
        planId: { type: string, format: uuid, nullable: true }
        error: { type: string, nullable: true, description: "Only when status is FAILED" }
    PlanEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        trainId: { type: string, format: uuid }
        kind: { type: string }
        startAt: { type: string }
        endAt: { type: string }
        resourceIds: { type: array, items: { type: string } }
    Validation:
      type: object
      properties:
        code: { type: string }
        severity: { type: string }
        message: { type: string }
        objectId: { type: string, nullable: true }
        startAt: { type: string, format: date-time, nullable: true }
        endAt: { type: string, format: date-time, nullable: true }
    PendingMilestone:
      type: object
      properties:
        trainId: { type: string, format: uuid }
        cycleCode: { type: string }
        nominalKm: { type: integer, format: int64 }
        remainingKm: { type: integer, format: int64 }
    ValidationReport:
      type: object
      description: Independent D2 report bound to the saved source, canonical event fingerprint and plan version. PASS applies only to its stated scope, never to actual train release.
      properties:
        schemaVersion: { type: string, enum: [d2-validation-1.0] }
        status: { type: string, enum: [NOT_PERFORMED, FAILED, PASS] }
        scope: { type: string }
        scenarioId: { type: string, format: uuid }
        sourceSnapshotId: { type: string, format: uuid, nullable: true }
        snapshotHash: { type: string }
        resultHash: { type: string, description: SHA-256 of d2-plan-events-v1 }
        policy: { type: string }
        solverStatus: { type: string }
        planVersion: { type: integer }
        checkedAt: { type: string, format: date-time }
        ruleVersion: { type: string, nullable: true }
        ruleConfirmation: { type: string, nullable: true }
        requiredServiceCount: { type: integer, nullable: true }
        pendingMilestones: { type: array, items: { $ref: '#/components/schemas/PendingMilestone' } }
        findings: { type: array, items: { $ref: '#/components/schemas/Validation' } }
    ResourceLoad:
      type: object
      properties:
        resourceId: { type: string }
        busyMinutes: { type: integer, format: int64 }
        horizonSharePercent: { type: number, description: Planned service minutes / whole horizon minutes * 100, not readiness or utilization of available shifts }
    PlanMetrics:
      type: object
      description: Counts from a D2-validated plan. No actual executed trips, readiness KPI or economic benefit is inferred.
      properties:
        scope: { type: string }
        scheduledTripCount: { type: integer }
        conflictingTripCount: { type: integer }
        requiredServiceCount: { type: integer }
        placedServiceCount: { type: integer }
        missingServiceCount: { type: integer }
        trainServiceMinutes: { type: integer, format: int64 }
        makespanMinutes: { type: integer, format: int64 }
        peakConcurrentService: { type: integer }
        resourceLoads: { type: array, items: { $ref: '#/components/schemas/ResourceLoad' } }
    Plan:
      type: object
      properties:
        id: { type: string, format: uuid }
        scenarioId: { type: string, format: uuid }
        version: { type: integer }
        status: { type: string, enum: [DRAFT, APPROVED] }
        approvedBy: { type: string, nullable: true, description: "Authenticated user who approved; the request's actorId is ignored" }
        events: { type: array, items: { $ref: '#/components/schemas/PlanEvent' } }
        validations: { type: array, items: { $ref: '#/components/schemas/Validation' } }
        snapshotHash: { type: string }
        validationStatus: { type: string, enum: [NOT_PERFORMED, FAILED, PASS] }
        validationReport: { $ref: '#/components/schemas/ValidationReport' }
        metrics:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PlanMetrics'
    PlanCalendar:
      type: object
      properties:
        scenarioId: { type: string, format: uuid }
        snapshotHash: { type: string }
        provenance: { type: string }
        policy: { type: string }
        solverStatus: { type: string }
        validationStatus: { type: string, enum: [NOT_PERFORMED, FAILED, PASS] }
        independentlyValidated: { type: boolean }
        horizonStart: { type: string, format: date-time }
        horizonEnd: { type: string, format: date-time }
        trains:
          type: array
          items: { $ref: '#/components/schemas/CalendarLane' }
        resources:
          type: array
          items: { $ref: '#/components/schemas/CalendarLane' }
        events:
          type: array
          items: { $ref: '#/components/schemas/CalendarEvent' }
    CalendarLane:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
    CalendarEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [TRIP, SERVICE] }
        trainId: { type: string, format: uuid }
        resourceId: { type: string, nullable: true }
        label: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        source: { type: string }
        reason: { type: string }
        cycleCode: { type: string, nullable: true }
        covers: { type: array, nullable: true, items: { type: string } }
        releaseOdometerKm: { type: integer, nullable: true }
        dueOdometerKm: { type: integer, nullable: true }
        dueAt: { type: string, format: date-time, nullable: true }
    ApiError:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        traceId: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              reason: { type: string }

    ChangeCommand:
      type: object
      required: [scenarioId, expectedVersion, idempotencyKey, reason, source, change]
      additionalProperties: false
      properties:
        scenarioId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 0 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        source: { type: string, minLength: 1, maxLength: 1000 }
        change:
          oneOf:
            - { $ref: '#/components/schemas/TripChange' }
            - { $ref: '#/components/schemas/TripAdd' }
            - { $ref: '#/components/schemas/TripCancel' }
            - { $ref: '#/components/schemas/UrgentMaintenance' }
            - { $ref: '#/components/schemas/ResourceOutage' }
            - { $ref: '#/components/schemas/RuleChange' }
            - { $ref: '#/components/schemas/TrainReleaseChange' }
            - { $ref: '#/components/schemas/UrgentRuleChange' }
    TripChange:
      type: object
      additionalProperties: false
      required: [kind, trainId, tripId, departureAt, arrivalAt]
      properties:
        kind: { type: string, const: TRIP_CHANGE }
        trainId: { type: string, format: uuid }
        tripId: { type: string, format: uuid }
        departureAt: { type: string, format: date-time }
        arrivalAt: { type: string, format: date-time }
    TripAdd:
      type: object
      additionalProperties: false
      required: [kind, trainId, tripId, departureAt, arrivalAt, distanceKm, label, origin, destination]
      properties:
        kind: { type: string, const: TRIP_ADD }
        trainId: { type: string, format: uuid }
        tripId: { type: string, format: uuid, description: New client-generated UUID retained across retries }
        departureAt: { type: string, format: date-time }
        arrivalAt: { type: string, format: date-time }
        distanceKm: { type: integer, minimum: 1 }
        label: { type: string, minLength: 1 }
        origin: { type: string, minLength: 1 }
        destination: { type: string, minLength: 1 }
    TripCancel:
      type: object
      additionalProperties: false
      required: [kind, trainId, tripId]
      properties:
        kind: { type: string, const: TRIP_CANCEL }
        trainId: { type: string, format: uuid }
        tripId: { type: string, format: uuid }
    UrgentMaintenance:
      type: object
      additionalProperties: false
      required: [kind, trainId, problemType, detectedAt, notBeforeCurrentTripEnd, workKind]
      anyOf:
        - { required: [deadlineAt] }
        - { required: [urgency] }
      properties:
        kind: { type: string, const: URGENT_MAINTENANCE }
        trainId: { type: string, format: uuid }
        problemType: { type: string, minLength: 1 }
        detectedAt: { type: string, format: date-time }
        notBeforeCurrentTripEnd: { type: boolean }
        earliestStartAt: { type: string, format: date-time }
        deadlineAt: { type: string, format: date-time }
        urgency: { type: string, enum: [CRITICAL, HIGH, NORMAL, IMMEDIATE, WITHIN_24H, WITHIN_HORIZON] }
        workKind: { type: string, minLength: 1 }
    ResourceOutage:
      type: object
      additionalProperties: false
      required: [kind, resourceId, startsAt, endsAt]
      properties:
        kind: { type: string, const: RESOURCE_OUTAGE }
        resourceId: { type: string, minLength: 1 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    RuleChange:
      type: object
      additionalProperties: false
      required: [kind, version, confirmationStatus, mileagePolicy, toleranceBasis, rules]
      properties:
        kind: { type: string, const: RULE_CHANGE }
        version: { type: string, minLength: 1, description: Globally unique rule-set version }
        confirmationStatus: { type: string, enum: [SYNTHETIC, UNCONFIRMED, CONFIRMED] }
        mileagePolicy: { type: string, enum: [ABSOLUTE_GRID, FROM_LAST_SERVICE, UNCONFIRMED] }
        toleranceBasis: { type: string, enum: [INTERVAL, NOMINAL_MILESTONE, UNCONFIRMED] }
        rules:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [code, intervalKm, toleranceBasisPoints, durationMinutes, rank, resourceIds]
            properties:
              code: { type: string, minLength: 1 }
              intervalKm: { type: integer, minimum: 1 }
              toleranceBasisPoints: { type: integer, minimum: 0, maximum: 9999 }
              durationMinutes: { type: integer, minimum: 1 }
              rank: { type: integer, minimum: 0 }
              resourceIds: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
        baselines:
          type: array
          description: Required for every train/cycle if the mileage grid changes; old accepted work is never rewritten
          items:
            type: object
            additionalProperties: false
            required: [trainId, cycleCode, creditedNominalKm]
            properties:
              trainId: { type: string, format: uuid }
              cycleCode: { type: string }
              creditedNominalKm: { type: integer, minimum: 0 }
    TrainReleaseChange:
      type: object
      additionalProperties: false
      required: [kind, trainId, availableFrom, location, basis]
      properties:
        kind: { type: string, const: TRAIN_RELEASE }
        trainId: { type: string, format: uuid }
        frozenWorkId: { type: string, format: uuid, nullable: true }
        availableFrom: { type: string, format: date-time }
        location: { type: string, minLength: 1 }
        basis: { type: string, enum: [ACCEPTED, FORECAST, DEMO_ASSUMPTION] }
        acceptedAt: { type: string, format: date-time, nullable: true, description: Required for ACCEPTED, cannot be in the future; forbidden for other bases }
        acceptanceDocument: { type: string, nullable: true, description: Required for ACCEPTED; forbidden for other bases }
    UrgentRuleChange:
      type: object
      additionalProperties: false
      required: [kind, version, rules]
      properties:
        kind: { type: string, const: URGENT_RULE_CHANGE }
        version: { type: string, minLength: 1 }
        rules:
          type: array
          minItems: 1
          maxItems: 100
          description: Replaces the catalog in the new source version; old requests and snapshots remain intact
          items:
            type: object
            additionalProperties: false
            required: [workKind, durationMinutes, resourceIds, confirmationStatus]
            properties:
              workKind: { type: string, minLength: 1 }
              durationMinutes: { type: integer, minimum: 1, maximum: 2147483647 }
              resourceIds: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
              confirmationStatus: { type: string, enum: [CONFIRMED, UNCONFIRMED, SYNTHETIC] }
    UrgentWorkSourceRule:
      type: object
      required: [scenario_id, id, work_kind, rule_version, duration_minutes, resource_ids, confirmation_status, source]
      properties:
        scenario_id: { type: string, format: uuid }
        id: { type: string, format: uuid }
        work_kind: { type: string }
        rule_version: { type: string }
        duration_minutes: { type: integer, minimum: 1 }
        resource_ids: { type: array, items: { type: string } }
        confirmation_status: { type: string, enum: [CONFIRMED, UNCONFIRMED, SYNTHETIC] }
        source: { type: string }
    SourceVersion:
      type: object
      properties:
        rootId: { type: string, format: uuid }
        scenarioId: { type: string, format: uuid }
        version: { type: integer, minimum: 0 }
        parentScenarioId: { type: string, format: uuid, nullable: true }
        snapshotId: { type: string, format: uuid }
        snapshotHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    ChangeReceipt:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        trainId: { type: string, format: uuid, nullable: true }
        tripId: { type: string, format: uuid, nullable: true }
        reason: { type: string }
        source: { type: string }
        reportedBy: { type: string }
        reportedAt: { type: string, format: date-time }
        version: { $ref: '#/components/schemas/SourceVersion' }
        change: { type: object, additionalProperties: true }
        status: { $ref: '#/components/schemas/RequestStatus' }
        jobId: { type: string, format: uuid, nullable: true }
        planId: { type: string, format: uuid, nullable: true }
        errorCode: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }
    RequestStatus:
      type: string
      enum: [RECEIVED, IN_CALCULATION, CALCULATED, VALIDATED, APPROVED, ERROR]
    RequestUpdate:
      type: object
      properties:
        sequence: { type: integer, minimum: 1 }
        requestId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RequestStatus' }
        actor: { type: string }
        jobId: { type: string, format: uuid, nullable: true }
        planId: { type: string, format: uuid, nullable: true }
        code: { type: string, nullable: true }
        message: { type: string, nullable: true }
        recordedAt: { type: string, format: date-time }
    RequestUpdates:
      type: object
      properties:
        nextCursor: { type: integer, minimum: 0 }
        events: { type: array, items: { $ref: '#/components/schemas/RequestUpdate' } }
    PlanSelection:
      type: object
      properties:
        rootId: { type: string, format: uuid }
        latestDraftId: { type: string, format: uuid, nullable: true }
        effectivePlanId: { type: string, format: uuid, nullable: true }
        effectivePlanUsesCurrentSource: { type: boolean }

    UiNewRequest:
      type: object
      required: [clientRequestId, expectedSnapshotHash, payload, comment]
      properties:
        clientRequestId: { type: string, minLength: 1, maxLength: 160 }
        expectedSnapshotHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        payload: { $ref: '#/components/schemas/UiRequestPayload' }
        comment: { type: string, maxLength: 1000 }
    UiRequestPayload:
      oneOf:
        - { $ref: '#/components/schemas/UiTripChange' }
        - { $ref: '#/components/schemas/UiUrgentMaintenance' }
    UiTripChange:
      type: object
      additionalProperties: false
      required: [kind, trainId, tripId, newDepartureAt, newArrivalAt, reason, source]
      properties:
        kind: { type: string, const: TRIP_CHANGE }
        trainId: { type: string, format: uuid }
        tripId: { type: string, format: uuid }
        newDepartureAt: { type: string, format: date-time }
        newArrivalAt: { type: string, format: date-time }
        reason: { type: string, minLength: 1 }
        source: { type: string, minLength: 1 }
    UiUrgentMaintenance:
      type: object
      additionalProperties: false
      required: [kind, trainId, problem, detectedAt, notBeforeTripEnd, urgency, dueBy, workType]
      properties:
        kind: { type: string, const: URGENT_MAINTENANCE }
        trainId: { type: string, format: uuid }
        problem: { type: string, minLength: 1 }
        detectedAt: { type: string, format: date-time }
        notBeforeTripEnd: { type: boolean }
        urgency: { type: string, enum: [IMMEDIATE, WITHIN_24H, WITHIN_HORIZON] }
        dueBy: { type: string, format: date-time, nullable: true }
        workType: { type: string, minLength: 1 }
    UiChangeRequest:
      type: object
      required: [id, number, scenarioId, baseSnapshotHash, status, payload, comment, createdBy, createdAt, newSnapshotHash, jobId, planId, validationStatus, decidedBy, decidedAt, error, newScenarioId, snapshotId, sourceVersion]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, minimum: 1 }
        scenarioId: { type: string, format: uuid, description: Stable scenario root for calendars and inbox }
        baseSnapshotHash: { type: string }
        status: { type: string, enum: [RECEIVED, APPLIED, CALCULATED, VALIDATED, APPROVED, REJECTED, FAILED] }
        payload: { $ref: '#/components/schemas/UiRequestPayload' }
        comment: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        newSnapshotHash: { type: string, nullable: true }
        jobId: { type: string, format: uuid, nullable: true }
        planId: { type: string, format: uuid, nullable: true }
        validationStatus: { type: string, enum: [PASS, FAILED, NOT_PERFORMED], nullable: true }
        decidedBy: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        error:
          type: object
          nullable: true
          properties:
            code: { type: string }
            message: { type: string }
        newScenarioId: { type: string, format: uuid, description: Exact new source revision for jobs; do not substitute the root }
        snapshotId: { type: string, format: uuid }
        sourceVersion: { type: integer, minimum: 1 }
