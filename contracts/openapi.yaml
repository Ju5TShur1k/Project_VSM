openapi: 3.1.0
info:
  title: OKNO VSM API
  version: "0.1.0"
servers:
  - url: /api/v1
# Everything except /actuator/health requires a session (cookie JSESSIONID from
# /auth/login). State-changing requests must also send the X-XSRF-TOKEN header
# with the value of the XSRF-TOKEN cookie (set on the first response, even a 401).
# Unauthenticated calls get 401 with the standard ApiError body.
paths:
  /auth/login:
    post:
      summary: Log in (form-encoded username + password), starts a session
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200': { description: Logged in }
        '401':
          description: Bad credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /auth/logout:
    post:
      summary: End the session
      responses:
        '200': { description: Logged out }

  /auth/me:
    get:
      summary: Current user (also used to obtain the XSRF-TOKEN cookie)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: { type: string }
                  role: { type: string, enum: [PLANNER, TECHNOLOGIST, DISPATCHER] }
        '401':
          description: Not logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /scenarios/import:
    post:
      summary: Import scenario
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                trains:
                  type: array
                  items:
                    $ref: '#/components/schemas/Train'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenarioId: { type: string, format: uuid }
                  warnings: { type: array, items: { type: string } }
                  provenance: { type: string }
        '422':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /demo/source:
    post:
      summary: Create synthetic E2 source facts and capture an immutable D1 snapshot
      description: Requires the database profile. All facts are labelled demonstration data.
      responses:
        '201':
          description: Saved source snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoSource' }

  /demo/scenarios/{id}/r1-arrival:
    post:
      summary: Change source trip R1 arrival and capture a new immutable snapshot
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arrivalMinute]
              properties:
                arrivalMinute: { type: integer, minimum: 50, maximum: 60, description: "Minutes after 2028-07-01T00:00:00+03:00" }
      responses:
        '200':
          description: New saved source snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DemoSource' }

  /demo/case-source:
    post:
      summary: Load additive case-derived model datasets and capture the saved source
      description: Numeric norms come from case 06; histories, dates and trips are modelled. FULL43 has an E3 assessment, but no approved 14-day plan yet.
      parameters:
        - in: query
          name: dataset
          required: true
          schema: { type: string, enum: [FULL43, E2_6, BLOCKED6] }
      responses:
        '201':
          description: Saved case model dataset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseDataset' }
        '422':
          description: Invalid dataset or missing database profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /source-snapshots/{id}/e3-assessment:
    get:
      summary: Assess whether the saved full-fleet source has a necessary service window for each work
      description: Read-only preflight. A result without blockers does not prove feasibility or D2 approval.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Full-fleet fixed-assignment assessment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/E3Assessment' }
        '404':
          description: Snapshot not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: Snapshot does not contain supported E3 source facts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /scenarios/{id}:
    get:
      summary: Get scenario snapshot
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  createdAt: { type: string, format: date-time }
                  provenance: { type: string }
                  trainCount: { type: integer }

  /scenarios/{id}/trains:
    get:
      summary: Get fleet for scenario
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Train' }

  /scenarios/{id}/events:
    post:
      summary: Inject event, creates new scenario version
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [MACHINE_DOWN, UNPLANNED_INSPECTION] }
                description: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  newScenarioId: { type: string, format: uuid }
        '422':
          description: Unknown failure kind
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /planning-jobs:
    post:
      summary: Start a planning job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobRequest' }
      description: >
        Queues the job and returns immediately (status QUEUED); the solver runs on
        a worker thread. Poll GET /planning-jobs/{id} until status is terminal.
        A repeated idempotencyKey with the SAME request body returns the existing
        job; the same key with a DIFFERENT body is 409 IDEMPOTENCY_KEY_REUSED.
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobStatus' }
        '409':
          description: idempotencyKey reused with a different request body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: Invalid policy / timeLimitSec (1..300) / seed / frozenUntil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /planning-jobs/{id}:
    get:
      summary: Get job status
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobStatus' }

  /plans/{id}:
    get:
      summary: Get plan detail
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }

  /plans/{id}/calendar:
    get:
      summary: Calendar from the immutable snapshot and actual planner result
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Fixed source trips and calculated service intervals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanCalendar' }

  /plans/{id}/approve:
    post:
      summary: Approve a plan version
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedVersion: { type: integer }
                actorId: { type: string }
                comment: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '409':
          description: Version conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422':
          description: >
            PLAN_NOT_APPROVABLE - the plan carries a CRITICAL validation, the solver
            found no admissible plan, or independent validation has not passed.
            Approval requires a D2 PASS report bound to the current source snapshot,
            plan version, solver status and event fingerprint. NOT_PERFORMED blocks approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /current-plan:
    get:
      summary: Newest plan of any scenario (what the dispatcher sees). Any role.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  planId: { type: string, format: uuid, nullable: true }

  /incidents:
    get:
      summary: Dispatcher's incident log, newest first. Any role.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Incident' } }
    post:
      summary: Report a trip change, urgent maintenance or equipment failure. Logged for the planner; not fed to the solver.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [train, kind, description]
              properties:
                train: { type: string }
                kind: { type: string, enum: [TRIP_CHANGE, URGENT_MAINTENANCE, EQUIPMENT_DOWN] }
                description: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '422':
          description: Invalid train, kind or description
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /plans/{id}/export:
    get:
      summary: Export plan as CSV
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema: { type: string }

  /scenarios/{id}/operations:
    post:
      summary: Start a persisted FULL43 advisory operational day
      description: Database profile only. Captures an immutable modelled source; does not authorize full E3 maintenance or actual release.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '201':
          description: Initial operational board
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryBoard' }
        '404': { description: Unknown scenario }
        '422': { description: Unsupported source or rules }
  /operations/{id}:
    get:
      summary: Restore current operational board from PostgreSQL
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { $ref: '#/components/responses/RecoveryUpdated' }
        '404': { description: Unknown session }
  /operations/{id}/failures:
    post:
      summary: Withdraw a train before its next departure in this modelled day
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FailureRequest' }
      responses:
        '200': { $ref: '#/components/responses/RecoveryUpdated' }
        '409': { description: Stale expectedVersion }
        '422': { description: Invalid failure, time, or missing expectedVersion }
  /operations/{id}/replacements:
    post:
      summary: Recheck and assign an eligible reserve to the remaining daily turn
      description: Operator decision; preserves times, route and paired slot. Reserve shortage is visible and does not silently forbid dispatch. No cross-city teleportation.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplacementRequest' }
      responses:
        '200': { $ref: '#/components/responses/RecoveryUpdated' }
        '409': { description: Stale expectedVersion }
        '422': { description: Ineligible candidate or invalid request }
  /operations/{id}/releases:
    post:
      summary: Record explicit modelled repair completion and acceptance into reserve
      description: Repair forecast is not acceptance. Original withdrawn trips are never automatically reassigned.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseRequest' }
      responses:
        '200': { $ref: '#/components/responses/RecoveryUpdated' }
        '409': { description: Stale expectedVersion }
        '422': { description: Invalid acceptance, location or time }
  /operations/{id}/clock:
    post:
      summary: Advance modelled time without inventing repair acceptance
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClockRequest' }
      responses:
        '200': { $ref: '#/components/responses/RecoveryUpdated' }
        '409': { description: Stale expectedVersion }
        '422': { description: Time reversal, out of horizon or invalid request }

components:
  responses:
    RecoveryUpdated:
      description: Current persisted advisory board; version and canonical stateHash identify this revision
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RecoveryBoard' }
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    FailureRequest:
      type: object
      required: [expectedVersion, tripId, occurredAt, description]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        tripId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        expectedRepairAt: { type: [string, 'null'], format: date-time }
        description: { type: string, minLength: 1, maxLength: 1000 }
    ReplacementRequest:
      type: object
      required: [expectedVersion, faultId, trainId]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        faultId: { type: string, format: uuid }
        trainId: { type: string, format: uuid }
    ReleaseRequest:
      type: object
      required: [expectedVersion, faultId, repairCompletedAt, acceptedAt, location, acceptanceReference]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        faultId: { type: string, format: uuid }
        repairCompletedAt: { type: string, format: date-time }
        acceptedAt: { type: string, format: date-time }
        location: { type: string }
        acceptanceReference: { type: string, minLength: 1, maxLength: 200 }
    ClockRequest:
      type: object
      required: [expectedVersion, asOf]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        asOf: { type: string, format: date-time }
    RecoveryCandidate:
      type: object
      required: [trainId, externalId, location, eligible, reasons]
      properties:
        trainId: { type: string, format: uuid }
        externalId: { type: string }
        location: { type: string }
        eligible: { type: boolean }
        reasons: { type: array, items: { type: string } }
    RecoveryTrain:
      type: object
      required: [id, externalId, status, location, mileageKm, readinessEvidence]
      properties:
        id: { type: string, format: uuid }
        externalId: { type: string }
        status: { type: string, enum: [LINE, RESERVE, MAINTENANCE, FAILED, IN_SERVICE, UNKNOWN] }
        location: { type: string }
        mileageKm: { type: integer, format: int64 }
        tripsSinceCleaning: { type: [integer, 'null'] }
        readinessEvidence: { type: string }
    RecoveryTrip:
      type: object
      required: [id, label, pairKey, plannedTrainId, plannedTrain, effectiveTrainId, effectiveTrain, origin, destination, departureAt, arrivalAt, coverage]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        pairKey: { type: string }
        plannedTrainId: { type: string, format: uuid }
        plannedTrain: { type: string }
        effectiveTrainId: { type: string, format: uuid }
        effectiveTrain: { type: string }
        origin: { type: string }
        destination: { type: string }
        departureAt: { type: string, format: date-time }
        arrivalAt: { type: string, format: date-time }
        coverage: { type: string, enum: [SCHEDULED, REPLACED, UNCOVERED] }
    RecoveryFault:
      type: object
      required: [id, trainId, train, trip, occurredAt, description, status, affectedTripIds, candidates]
      properties:
        id: { type: string, format: uuid }
        trainId: { type: string, format: uuid }
        train: { type: string }
        trip: { type: string }
        occurredAt: { type: string, format: date-time }
        expectedRepairAt: { type: [string, 'null'], format: date-time }
        description: { type: string }
        status: { type: string, enum: [NEEDS_REPLACEMENT, REPLACEMENT_ASSIGNED, RELEASED_TO_RESERVE] }
        affectedTripIds: { type: array, items: { type: string, format: uuid } }
        replacementTrain: { type: [string, 'null'] }
        candidates: { type: array, items: { $ref: '#/components/schemas/RecoveryCandidate' } }
        acceptedAt: { type: [string, 'null'], format: date-time }
    RecoveryBoard:
      type: object
      required: [id, version, stateHash, scenarioId, sourceSnapshotId, snapshotHash, scope, provenance, windowStart, windowEnd, asOf, policy, trainCount, availableTrainCount, unavailableTrainCount, uncoveredTripCount, incompletePairCount, reserve, trains, trips, faults, messages]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        stateHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        scenarioId: { type: string, format: uuid }
        sourceSnapshotId: { type: string, format: uuid }
        snapshotHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        scope: { type: string, const: OPERATIONAL_DAY_MODEL }
        provenance: { type: string }
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }
        asOf: { type: string, format: date-time }
        policy:
          type: object
          required: [version, preparationMinutes, targetReservePerCity, cleaningEveryTrips, source]
          properties:
            version: { type: string }
            preparationMinutes: { type: integer }
            targetReservePerCity: { type: integer }
            cleaningEveryTrips: { type: integer }
            source: { type: string }
        trainCount: { type: integer }
        availableTrainCount: { type: integer, description: Instant modelled availability, not fleet readiness KPI }
        unavailableTrainCount: { type: integer }
        uncoveredTripCount: { type: integer }
        incompletePairCount: { type: integer }
        reserve:
          type: array
          items:
            type: object
            required: [location, available, target, deficit]
            properties:
              location: { type: string }
              available: { type: integer }
              target: { type: integer }
              deficit: { type: integer }
        trains: { type: array, items: { $ref: '#/components/schemas/RecoveryTrain' } }
        trips: { type: array, items: { $ref: '#/components/schemas/RecoveryTrip' } }
        faults: { type: array, items: { $ref: '#/components/schemas/RecoveryFault' } }
        messages: { type: array, items: { type: string } }
    Incident:
      type: object
      properties:
        id: { type: string, format: uuid }
        train: { type: string }
        kind: { type: string, enum: [TRIP_CHANGE, URGENT_MAINTENANCE, EQUIPMENT_DOWN] }
        description: { type: string }
        reportedBy: { type: string }
        reportedAt: { type: string, format: date-time }
    CaseDataset:
      type: object
      required: [source, dataset, trainCount, tripCount, planningSupported, warnings]
      properties:
        source: { $ref: '#/components/schemas/DemoSource' }
        dataset: { type: string, enum: [FULL43, E2_6, BLOCKED6] }
        trainCount: { type: integer }
        tripCount: { type: integer }
        planningSupported: { type: boolean }
        warnings: { type: array, items: { type: string } }
    E3Assessment:
      type: object
      required: [scenarioId, sourceSnapshotId, snapshotHash, provenance, trainCount, tripCount, requiredWorkCount, fixedAssignmentStatus, d2Status, blockers]
      properties:
        scenarioId: { type: string, format: uuid }
        sourceSnapshotId: { type: string, format: uuid }
        snapshotHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        provenance: { type: string }
        trainCount: { type: integer }
        tripCount: { type: integer }
        requiredWorkCount: { type: integer }
        fixedAssignmentStatus:
          type: string
          enum: [BLOCKED_BY_FIXED_ASSIGNMENTS, NECESSARY_WINDOWS_PRESENT]
        d2Status: { type: string, const: NOT_PERFORMED }
        blockers:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
    DemoSource:
      type: object
      properties:
        scenarioId: { type: string, format: uuid }
        snapshotId: { type: string, format: uuid }
        snapshotHash: { type: string }
        provenance: { type: string }
    Train:
      type: object
      properties:
        id: { type: string, format: uuid }
        externalId: { type: string }
        status:
          type: string
          enum: [AVAILABLE, IN_SERVICE, READY_IDLE, HOT_RESERVE, RESERVE, MAINTENANCE, CLEANING, FAULT, TRANSFER, AWAITING_RELEASE, NOT_COMMISSIONED]
        mileageKm: { type: number }
        nextObligation: { type: string }
    JobRequest:
      type: object
      required: [scenarioId, policy]
      properties:
        scenarioId: { type: string, format: uuid }
        policy: { type: string }
        seed: { type: integer }
        timeLimitSec: { type: integer }
        frozenUntil: { type: string, format: date-time }
        idempotencyKey: { type: string }
    JobStatus:
      type: object
      properties:
        jobId: { type: string, format: uuid }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED] }
        solverStatus: { type: string, enum: [OPTIMAL, FEASIBLE, INFEASIBLE, UNKNOWN, MODEL_INVALID] }
        planId: { type: string, format: uuid, nullable: true }
        error: { type: string, nullable: true, description: "Only when status is FAILED" }
    PlanEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        trainId: { type: string, format: uuid }
        kind: { type: string }
        startAt: { type: string }
        endAt: { type: string }
        resourceIds: { type: array, items: { type: string } }
    Validation:
      type: object
      properties:
        code: { type: string }
        severity: { type: string }
        message: { type: string }
        objectId: { type: string, nullable: true }
        startAt: { type: string, format: date-time, nullable: true }
        endAt: { type: string, format: date-time, nullable: true }
    PendingMilestone:
      type: object
      properties:
        trainId: { type: string, format: uuid }
        cycleCode: { type: string }
        nominalKm: { type: integer, format: int64 }
        remainingKm: { type: integer, format: int64 }
    ValidationReport:
      type: object
      description: Independent D2 report bound to the saved source, canonical event fingerprint and plan version. PASS applies only to its stated scope, never to actual train release.
      properties:
        schemaVersion: { type: string, enum: [d2-validation-1.0] }
        status: { type: string, enum: [NOT_PERFORMED, FAILED, PASS] }
        scope: { type: string }
        scenarioId: { type: string, format: uuid }
        sourceSnapshotId: { type: string, format: uuid, nullable: true }
        snapshotHash: { type: string }
        resultHash: { type: string, description: SHA-256 of d2-plan-events-v1 }
        policy: { type: string }
        solverStatus: { type: string }
        planVersion: { type: integer }
        checkedAt: { type: string, format: date-time }
        ruleVersion: { type: string, nullable: true }
        ruleConfirmation: { type: string, nullable: true }
        requiredServiceCount: { type: integer, nullable: true }
        pendingMilestones: { type: array, items: { $ref: '#/components/schemas/PendingMilestone' } }
        findings: { type: array, items: { $ref: '#/components/schemas/Validation' } }
    ResourceLoad:
      type: object
      properties:
        resourceId: { type: string }
        busyMinutes: { type: integer, format: int64 }
        horizonSharePercent: { type: number, description: Planned service minutes / whole horizon minutes * 100, not readiness or utilization of available shifts }
    PlanMetrics:
      type: object
      description: Counts from a D2-validated plan. No actual executed trips, readiness KPI or economic benefit is inferred.
      properties:
        scope: { type: string }
        scheduledTripCount: { type: integer }
        conflictingTripCount: { type: integer }
        requiredServiceCount: { type: integer }
        placedServiceCount: { type: integer }
        missingServiceCount: { type: integer }
        trainServiceMinutes: { type: integer, format: int64 }
        makespanMinutes: { type: integer, format: int64 }
        peakConcurrentService: { type: integer }
        resourceLoads: { type: array, items: { $ref: '#/components/schemas/ResourceLoad' } }
    Plan:
      type: object
      properties:
        id: { type: string, format: uuid }
        scenarioId: { type: string, format: uuid }
        version: { type: integer }
        status: { type: string, enum: [DRAFT, APPROVED] }
        approvedBy: { type: string, nullable: true, description: "Authenticated user who approved; the request's actorId is ignored" }
        events: { type: array, items: { $ref: '#/components/schemas/PlanEvent' } }
        validations: { type: array, items: { $ref: '#/components/schemas/Validation' } }
        snapshotHash: { type: string }
        validationStatus: { type: string, enum: [NOT_PERFORMED, FAILED, PASS] }
        validationReport: { $ref: '#/components/schemas/ValidationReport' }
        metrics:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PlanMetrics'
    PlanCalendar:
      type: object
      properties:
        scenarioId: { type: string, format: uuid }
        snapshotHash: { type: string }
        provenance: { type: string }
        policy: { type: string }
        solverStatus: { type: string }
        validationStatus: { type: string, enum: [NOT_PERFORMED, FAILED, PASS] }
        independentlyValidated: { type: boolean }
        horizonStart: { type: string, format: date-time }
        horizonEnd: { type: string, format: date-time }
        trains:
          type: array
          items: { $ref: '#/components/schemas/CalendarLane' }
        resources:
          type: array
          items: { $ref: '#/components/schemas/CalendarLane' }
        events:
          type: array
          items: { $ref: '#/components/schemas/CalendarEvent' }
    CalendarLane:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
    CalendarEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [TRIP, SERVICE] }
        trainId: { type: string, format: uuid }
        resourceId: { type: string, nullable: true }
        label: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        source: { type: string }
        reason: { type: string }
        cycleCode: { type: string, nullable: true }
        covers: { type: array, nullable: true, items: { type: string } }
        releaseOdometerKm: { type: integer, nullable: true }
        dueOdometerKm: { type: integer, nullable: true }
        dueAt: { type: string, format: date-time, nullable: true }
    ApiError:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        traceId: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              reason: { type: string }
