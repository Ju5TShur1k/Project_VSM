openapi: 3.1.0
info:
  title: OKNO VSM API
  version: "0.1.0"
servers:
  - url: /api/v1
paths:
  /scenarios/import:
    post:
      summary: Import scenario
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                trains:
                  type: array
                  items:
                    $ref: '#/components/schemas/Train'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenarioId: { type: string, format: uuid }
                  warnings: { type: array, items: { type: string } }
                  provenance: { type: string }
        '422':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /scenarios/{id}:
    get:
      summary: Get scenario snapshot
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  createdAt: { type: string, format: date-time }
                  provenance: { type: string }
                  trainCount: { type: integer }

  /scenarios/{id}/trains:
    get:
      summary: Get fleet for scenario
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Train' }

  /scenarios/{id}/events:
    post:
      summary: Inject event, creates new scenario version
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string }
                description: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  newScenarioId: { type: string, format: uuid }

  /planning-jobs:
    post:
      summary: Start a planning job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobRequest' }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobStatus' }

  /planning-jobs/{id}:
    get:
      summary: Get job status
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobStatus' }

  /plans/{id}:
    get:
      summary: Get plan detail
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }

  /plans/{id}/approve:
    post:
      summary: Approve a plan version
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedVersion: { type: integer }
                actorId: { type: string }
                comment: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '409':
          description: Version conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /plans/{id}/export:
    get:
      summary: Export plan as CSV
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema: { type: string }

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Train:
      type: object
      properties:
        id: { type: string, format: uuid }
        externalId: { type: string }
        status:
          type: string
          enum: [IN_SERVICE, READY_IDLE, HOT_RESERVE, MAINTENANCE, CLEANING, FAULT, TRANSFER, AWAITING_RELEASE, NOT_COMMISSIONED]
        mileageKm: { type: number }
        nextObligation: { type: string }
    JobRequest:
      type: object
      required: [scenarioId, policy]
      properties:
        scenarioId: { type: string, format: uuid }
        policy: { type: string }
        seed: { type: integer }
        timeLimitSec: { type: integer }
        frozenUntil: { type: string, format: date-time }
        idempotencyKey: { type: string }
    JobStatus:
      type: object
      properties:
        jobId: { type: string, format: uuid }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED] }
        solverStatus: { type: string, enum: [OPTIMAL, FEASIBLE, INFEASIBLE, UNKNOWN, MODEL_INVALID] }
        planId: { type: string, format: uuid, nullable: true }
    PlanEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        trainId: { type: string, format: uuid }
        kind: { type: string }
        startAt: { type: string }
        endAt: { type: string }
        resourceIds: { type: array, items: { type: string } }
    Validation:
      type: object
      properties:
        code: { type: string }
        severity: { type: string }
        message: { type: string }
    Plan:
      type: object
      properties:
        id: { type: string, format: uuid }
        scenarioId: { type: string, format: uuid }
        version: { type: integer }
        status: { type: string, enum: [DRAFT, APPROVED] }
        events: { type: array, items: { $ref: '#/components/schemas/PlanEvent' } }
        validations: { type: array, items: { $ref: '#/components/schemas/Validation' } }
    ApiError:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        traceId: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              reason: { type: string }
